<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التنبيهات — أثر</title>
    <link rel="stylesheet" href="../src/css/reset.css">
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/typography.css">
    <link rel="stylesheet" href="../src/css/glass.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/animations.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/utilities.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', 'Outfit', sans-serif; }
        .notif-card {
            padding: 22px 28px; border-radius: 20px;
            background: rgba(255,255,255,0.02);
            transition: var(--transition);
            border-right: 3px solid transparent;
            position: relative; overflow: hidden;
        }
        .notif-card.unread { 
            background: rgba(5,217,232,0.03);
            border-right-color: var(--accent-cyan);
        }
        .notif-card:hover { background: rgba(255,255,255,0.04); transform: translateX(-4px); }
        .notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-cyan); box-shadow: 0 0 6px rgba(5,217,232,0.6); flex-shrink: 0; }
        .empty-state { text-align: center; padding: 80px 20px; opacity: 0.45; }
        .empty-state div { font-size: 64px; margin-bottom: 20px; }
    </style>
</head>

<body class="dashboard-grid">
    <aside class="sidebar glass" style="margin:20px; border-radius:30px;"></aside>

    <main class="container" style="padding:40px; max-width:900px; width:100%; box-sizing:border-box;">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; flex-wrap:wrap; gap:20px;">
            <div>
                <h1 class="gradient-text syne" style="font-size:34px; font-weight:800;" id="page-title">التنبيهات</h1>
                <p style="opacity:0.5; margin-top:6px; font-size:14px;" id="page-subtitle">آخر الأخبار والتحديثات المتعلقة بك</p>
            </div>
            <button id="mark-all-btn" class="btn btn-outline" style="padding:10px 20px; font-size:13px; border-radius:12px;">
                ✓ تحديد الكل كمقروء
            </button>
        </header>

        <div id="notif-list" style="display:flex; flex-direction:column; gap:12px;"></div>
    </main>

    <script type="module" src="../src/pages/notifications.js"></script>
  <script type="module" src="../src/js/cookieconsent.js"></script>
  <script type="module" src="../src/js/icons.js"></script>
</body>

</html>
