<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثر — الدورات التكوينية والشهادات</title>
    <link rel="stylesheet" href="../src/css/reset.css">
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/typography.css">
    <link rel="stylesheet" href="../src/css/glass.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/animations.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/utilities.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', 'Outfit', sans-serif;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: var(--sidebar-w) 1fr;
            min-height: 100vh;
        }

        @media (max-width: 992px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
        }

        .course-card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: none !important;
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.25);
            transition: var(--transition);
        }

        .course-card:hover {
            transform: translateY(-8px) translateX(-4px);
            background: rgba(16, 14, 37, 0.9);
            box-shadow: 14px 14px 0px var(--accent-cyan);
        }
    </style>
</head>

<body class="dashboard-grid">
    <!-- SIDEBAR -->
    <aside class="sidebar glass" style="margin:20px; border-radius:30px;"></aside>

    <!-- MAIN CONTENT -->
    <main class="container" style="padding: 40px; max-width: 1300px; width: 100%; box-sizing: border-box;">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; flex-wrap:wrap; gap:20px;">
            <div>
                <h1 class="gradient-text syne" style="font-size:36px; font-weight:800;" id="page-title">الدورات التكوينية والشهادات الرقمية</h1>
                <p style="opacity:0.65; margin-top:5px;" id="page-subtitle">طوّر مهاراتك التقنية والحياتية، واحصل على شهادة معتمدة من ديوان مؤسسات الشباب</p>
            </div>
        </header>

        <!-- FILTERS -->
        <section class="glass flex-center spring-in" style="justify-content:space-between; padding:20px 30px; border-radius:22px; margin-bottom:40px; flex-wrap:wrap; gap:20px;">
            <input type="text" id="search-input" placeholder="ابحث عن دورة تكوينية..." style="background:transparent; border:none; color:var(--text-primary); outline:none; font-family:inherit; font-size:14px; width:60%;">
            <div class="mono" style="font-size:12px; opacity:0.65;" id="lbl-total-courses">COURSES: 0</div>
        </section>

        <!-- COURSES GRID -->
        <section id="courses-grid" class="spring-in" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:30px;"></section>
    </main>

    <script type="module" src="../src/pages/training.js"></script>
  <script type="module" src="../src/js/cookieconsent.js"></script>
  <script type="module" src="../src/js/icons.js"></script>
</body>

</html>
