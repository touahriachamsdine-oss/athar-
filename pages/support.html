<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثر — الاستشارات والدعم النفسي والوقائي</title>
    <link rel="stylesheet" href="../src/css/reset.css">
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/typography.css">
    <link rel="stylesheet" href="../src/css/glass.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/animations.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/utilities.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', 'Outfit', sans-serif;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: var(--sidebar-w) 1fr;
            min-height: 100vh;
        }

        @media (max-width: 992px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
        }

        .consult-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none !important;
            color: var(--text-primary);
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.25);
        }

        .tab-btn.active {
            background: var(--accent-pink) !important;
            color: #FFFFFF !important;
            box-shadow: 6px 6px 0px var(--accent-cyan) !important;
            transform: translateY(-4px) translateX(-2px);
        }

        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px) translateX(-2px);
            box-shadow: 6px 6px 0px rgba(255, 255, 255, 0.1);
        }

        .consult-card {
            background: var(--glass-bg);
            border: none !important;
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.25);
            transition: var(--transition);
        }

        .consult-card:hover {
            background: rgba(16, 14, 37, 0.9);
            transform: translateY(-8px) translateX(-4px);
            box-shadow: 14px 14px 0px var(--accent-purple);
        }
    </style>
</head>

<body class="dashboard-grid">
    <!-- SIDEBAR -->
    <aside class="sidebar glass" style="margin:20px; border-radius:30px;"></aside>

    <!-- MAIN CONTENT -->
    <main class="container" style="padding: 40px; max-width: 1100px; width: 100%; box-sizing: border-box;">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; flex-wrap:wrap; gap:20px;">
            <div>
                <h1 class="gradient-text syne" style="font-size:36px; font-weight:800;" id="page-title">الاستشارات والدعم الوقائي</h1>
                <p style="opacity:0.65; margin-top:5px;" id="page-subtitle">اطرح استشارتك بسرية تامة وتلقى الإجابة من أخصائيين نفسيين واجتماعيين معتمدين</p>
            </div>
        </header>

        <!-- TABS -->
        <div class="consult-tabs">
            <button class="tab-btn active" id="tab-ask" data-tab="ask">طرح استشارة جديدة</button>
            <button class="tab-btn" id="tab-public" data-tab="public">استشارات عامة مجابة</button>
            <button class="tab-btn" id="tab-mine" data-tab="mine">استشاراتي الخاصة</button>
        </div>

        <!-- TAB: ASK -->
        <section id="sec-ask" class="glass spring-in" style="padding:40px; border-radius:28px;">
            <h2 class="syne mb-20" style="font-size:24px; font-weight:700;" id="form-heading">اكتب سؤالك أو مشكلتك هنا بسرية تامة</h2>
            
            <form id="consultation-form">
                <div class="mb-20">
                    <textarea id="question-textarea" class="input-field" rows="6" required placeholder="اكتب تفاصيل استشارتك هنا... نحن هنا للاستماع إليك ومساعدتك دون أي إحراج." style="resize:none; font-family:inherit; font-size:16px;"></textarea>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; flex-wrap:wrap; gap:20px;">
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="checkbox" id="anon-checkbox" style="width:18px; height:18px; accent-color:var(--accent-purple);">
                        <span style="font-size:14px; opacity:0.85;" id="lbl-anon">إرسال كـ "مجهول الهوية" (لن يتم ربطه بحسابك)</span>
                    </label>

                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="checkbox" id="public-checkbox" checked style="width:18px; height:18px; accent-color:var(--accent-purple);">
                        <span style="font-size:14px; opacity:0.85;" id="lbl-public">السماح بنشر الاستشارة والإجابة بشكل عام (بدون هويتك) للاستفادة</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="padding:15px 40px; font-size:16px; border-radius:12px; justify-content:center; width:100%;" id="btn-submit">إرسال الاستشارة الآمنة</button>
            </form>
        </section>

        <!-- TAB: PUBLIC -->
        <section id="sec-public" style="display:none;"></section>

        <!-- TAB: MINE -->
        <section id="sec-mine" style="display:none;"></section>
    </main>

    <script type="module" src="../src/pages/support.js"></script>
  <script type="module" src="../src/js/cookieconsent.js"></script>
  <script type="module" src="../src/js/icons.js"></script>
</body>

</html>
