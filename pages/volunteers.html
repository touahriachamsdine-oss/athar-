<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثر — التطوع والأنشطة</title>
    <link rel="stylesheet" href="../src/css/reset.css">
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/typography.css">
    <link rel="stylesheet" href="../src/css/glass.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/animations.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/utilities.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', 'Outfit', sans-serif; }

        .dashboard-grid { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
        @media (max-width: 992px) { .dashboard-grid { grid-template-columns: 1fr; } .sidebar { display: none; } }

        .vs-card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: none !important;
            border-radius: 24px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.25);
            transition: var(--transition);
        }
        .vs-card:hover { transform: translateY(-8px) translateX(-4px); box-shadow: 14px 14px 0px var(--accent-pink); }

        .status-pill { font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 100px; letter-spacing: 0.5px; }
        .status-pill.approved { background: rgba(255, 42, 109, 0.12); color: var(--accent-pink); }
        .status-pill.pending { background: rgba(255, 190, 11, 0.12); color: var(--accent-amber); }
        .status-pill.completed { background: rgba(5, 217, 232, 0.12); color: var(--accent-cyan); }
        .status-pill.rejected { background: rgba(255, 255, 255, 0.08); color: var(--text-dim); }

        .vs-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; opacity: 0.85; }

        fieldset { border: none; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        fieldset .full { grid-column: 1 / -1; }
        fieldset input, fieldset select, fieldset textarea {
            width: 100%; box-sizing: border-box;
            background: rgba(16, 14, 37, 0.85);
            border: none !important; outline: none !important;
            color: var(--text-primary);
            padding: 12px 16px; border-radius: 14px;
            font-family: inherit; font-weight: 700;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.2);
        }
        fieldset textarea { resize: vertical; min-height: 70px; }
        fieldset label { font-size: 12px; font-weight: 700; opacity: 0.7; display: block; margin-bottom: 6px; }
    </style>
</head>

<body class="dashboard-grid">
    <aside class="sidebar glass" style="margin:20px; border-radius:30px;"></aside>

    <main class="container" style="padding: 40px; max-width: 1300px; width: 100%; box-sizing: border-box;">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; flex-wrap:wrap; gap:20px;">
            <div>
                <h1 class="gradient-text syne" style="font-size:36px; font-weight:800;" id="page-title">العمل التطوعي والأنشطة</h1>
                <p style="opacity:0.65; margin-top:5px;" id="page-subtitle">انخرط في أنشطة تطوعية منظمة واكسب نقاط الأثر</p>
            </div>
            <button id="btn-create" class="btn btn-primary" style="display:none; padding:12px 28px;" onclick="document.getElementById('create-wrap').style.display = document.getElementById('create-wrap').style.display === 'none' ? 'block' : 'none';">
                ➕ <span data-i18n="vs_create_btn">إنشاء نشاط تطوعي</span>
            </button>
        </header>

        <!-- CREATE SESSION (leaders / admins) -->
        <section id="create-wrap" class="glass spring-in" style="display:none; padding:30px; border-radius:22px; margin-bottom:40px;">
            <h3 class="syne mb-20" style="font-size:20px; font-weight:800;" id="lbl-create-title">إنشاء نشاط تطوعي جديد</h3>
            <fieldset>
                <div>
                    <label for="c-init">المبادرة / Initiative</label>
                    <select id="c-init"></select>
                </div>
                <div>
                    <label for="c-capacity">العدد الأقصى للشباب / Capacité</label>
                    <input id="c-capacity" type="number" min="1" max="100" value="10">
                </div>
                <div>
                    <label for="c-title">العنوان / Titre</label>
                    <input id="c-title" type="text" placeholder="عنوان النشاط">
                </div>
                <div>
                    <label for="c-location">المكان / Lieu</label>
                    <input id="c-location" type="text" placeholder="الحي، الولاية">
                </div>
                <div>
                    <label for="c-start">البداية (تاريخ ووقت) / Début</label>
                    <input id="c-start" type="datetime-local">
                </div>
                <div>
                    <label for="c-duration">المدة بالساعات / Durée (h)</label>
                    <input id="c-duration" type="number" min="1" max="8" value="3">
                </div>
                <div class="full">
                    <label for="c-desc">الوصف / Description</label>
                    <textarea id="c-desc" placeholder="وصف مختصر للنشاط"></textarea>
                </div>
            </fieldset>
            <button id="c-submit" class="btn btn-primary" style="margin-top:20px; padding:12px 34px;">إنشاء / Créer</button>
        </section>

        <!-- PENDING REVIEW QUEUE (admins) -->
        <section id="queue-wrap" style="display:none; margin-bottom:40px;">
            <h2 class="syne mb-20" style="font-size:22px; font-weight:800;" id="lbl-queue-title">بانتظار موافقة الإدارة</h2>
            <div id="queue-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:24px;"></div>
        </section>

        <!-- AVAILABLE SESSIONS -->
        <h2 class="syne mb-20" style="font-size:22px; font-weight:800;" id="lbl-available-title">الأنشطة المتاحة</h2>
        <section id="sessions-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:24px;"></section>
    </main>

    <script type="module" src="../src/pages/volunteers.js"></script>
</body>

</html>
