<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي — أثر</title>
    <link rel="stylesheet" href="../src/css/reset.css">
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/typography.css">
    <link rel="stylesheet" href="../src/css/glass.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/animations.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/utilities.css">
</head>

<body class="flex-center" style="min-height:100vh; padding:20px;">
    <div id="living-canvas" style="position:fixed; inset:0; z-index:-1;"></div>

    <div class="glass spring-in" style="width:100%; max-width:720px; height:min(80vh, 760px); border-radius:30px; display:flex; flex-direction:column; overflow:hidden;">

        <!-- Chat Header -->
        <div style="padding:20px 24px; display:flex; align-items:center; gap:14px;">
            <a href="dashboard.html" aria-label="Home" style="display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,0.05); color:var(--text-primary); text-decoration:none;">‹</a>
            <div style="flex:1;">
                <h1 class="syne" id="chat-title" style="font-size:18px; font-weight:800;">مساعد أثر الذكي</h1>
                <p id="chat-subtitle" style="font-size:11px; opacity:0.7; margin-top:2px;">أجب عن النشاطات، التسجيل، التطوع، المواعيد والبرامج</p>
            </div>
            <div style="text-align:right;">
                <label for="chat-lang" id="chat-lang-label" style="display:block; font-size:10px; opacity:0.65; margin-bottom:4px;">لغة المساعد</label>
                <select id="chat-lang" class="ai-select" style="font-size:12px; padding:6px 10px; border-radius:10px;">
                    <option value="ar">عربية</option>
                    <option value="fr">Français</option>
                    <option value="en">English</option>
                    <option value="amz">Tamazight</option>
                </select>
            </div>
        </div>

        <!-- Messages -->
        <div id="chat-messages" style="flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:12px;"></div>

        <!-- Suggestions -->
        <div id="chat-suggestions" style="display:flex; gap:8px; flex-wrap:wrap; padding:0 24px 12px;"></div>

        <!-- Composer -->
        <form id="chat-form" style="display:flex; gap:10px; padding:14px 20px;">
            <input type="text" id="chat-input" class="input-field" autocomplete="off" style="flex:1; height:50px;" placeholder="اكتب سؤالك هنا...">
            <button type="submit" id="chat-send" class="btn btn-primary" style="width:56px; height:50px; justify-content:center; font-size:18px; padding:0;">→</button>
        </form>
    </div>

    <script type="module" src="../src/pages/chat.js"></script>
  <script type="module" src="../src/js/cookieconsent.js"></script>
  <script type="module" src="../src/js/icons.js"></script>
</body>

</html>
