<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور — أثر</title>
    <link rel="stylesheet" href="../src/css/reset.css">
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/typography.css">
    <link rel="stylesheet" href="../src/css/glass.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/animations.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/utilities.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', 'Outfit', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>

<body>
    <main class="container" style="max-width: 480px; width: 100%; padding: 20px;">
        <div class="glass" style="padding: 40px; border-radius: 30px;">
            <h1 class="gradient-text syne" style="font-size: 26px; font-weight: 800; margin-bottom: 10px;" id="page-title">إعادة تعيين كلمة المرور</h1>
            <p style="opacity: 0.8; font-size: 14px; margin-bottom: 30px;" id="page-subtitle">أدخل كلمة المرور الجديدة لحسابك</p>

            <form id="reset-form" style="display: flex; flex-direction: column; gap: 20px;">
                <div>
                    <label style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px;" id="label-password">كلمة المرور الجديدة</label>
                    <input type="password" id="password-input" class="input-field" required placeholder="••••••••" style="width: 100%;">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;" id="submit-btn">تحديث كلمة المرور</button>
            </form>
            <div id="message" style="margin-top: 20px; font-size: 14px; text-align: center;"></div>
        </div>
    </main>

    <script type="module" src="../src/pages/reset-password.js"></script>
  <script type="module" src="../src/js/cookieconsent.js"></script>
  <script type="module" src="../src/js/icons.js"></script>
</body>

</html>
