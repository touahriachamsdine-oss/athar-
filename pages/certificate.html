<!DOCTYPE html>
<html data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شهادة تأهيل — أثر</title>
    <link rel="stylesheet" href="../src/css/reset.css">
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/typography.css">
    <link rel="stylesheet" href="../src/css/glass.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/animations.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/utilities.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', 'Outfit', sans-serif;
            min-height: 100vh;
        }

        .cert-main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .cert-card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: none !important;
            border-radius: 28px;
            padding: 70px 60px;
            max-width: 780px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 0 2px rgba(255, 42, 109, 0.35), 0 0 60px rgba(163, 0, 255, 0.18), 12px 12px 0px rgba(0, 0, 0, 0.3);
            position: relative;
            box-sizing: border-box;
        }

        .cert-corner {
            position: absolute;
            width: 46px;
            height: 46px;
            border: 2px solid rgba(5, 217, 232, 0.55);
        }
        .cert-corner.tl { top: 22px; left: 22px; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
        .cert-corner.tr { top: 22px; right: 22px; border-left: none; border-bottom: none; border-radius: 0 10px 0 0; }
        .cert-corner.bl { bottom: 22px; left: 22px; border-right: none; border-top: none; border-radius: 0 0 0 10px; }
        .cert-corner.br { bottom: 22px; right: 22px; border-left: none; border-top: none; border-radius: 0 0 10px 0; }

        .cert-label {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.55;
            margin-bottom: 10px;
        }

        .cert-badge {
            font-size: 56px;
            margin-bottom: 24px;
        }

        .cert-name {
            font-size: 38px;
            font-weight: 800;
            color: var(--neon-green, #00ffb2);
            line-height: 1.3;
            margin-bottom: 18px;
        }

        .cert-course {
            font-size: 18px;
            opacity: 0.75;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .cert-date {
            font-family: var(--mono);
            font-size: 13px;
            opacity: 0.55;
            margin-bottom: 40px;
        }

        .cert-issuer {
            font-size: 12px;
            opacity: 0.45;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        #cert-message {
            display: none;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-pink, #ff2a6d);
            padding: 40px 10px;
        }

        #cert-message.visible {
            display: block;
        }

        #cert-body.hidden {
            display: none;
        }

        .btn-print {
            min-width: 220px;
        }

        @media print {
            body {
                background: #fff !important;
            }
            .cert-main {
                min-height: auto;
                padding: 0;
            }
            .cert-card {
                box-shadow: none;
                border: 2px solid #000 !important;
                border-radius: 0;
                padding: 50px 40px;
                max-width: 100%;
            }
            .cert-corner {
                border-color: #000 !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="container cert-main">
        <div class="glass cert-card">
            <div class="cert-corner tl"></div>
            <div class="cert-corner tr"></div>
            <div class="cert-corner bl"></div>
            <div class="cert-corner br"></div>

            <div id="cert-message"></div>

            <div id="cert-body">
                <div class="cert-label" id="cert-label">شهادة تأهيل</div>
                <div class="cert-badge"><span data-icon="grad" data-size="44" style="color:var(--neon-green);"></span></div>
                <div class="cert-name" id="cert-name">—</div>
                <div class="cert-course" id="cert-course">—</div>
                <div class="cert-date" id="cert-date">—</div>
                <div class="cert-issuer" id="cert-issuer">أثر — المنصة الرقمية لبيوت الشباب</div>
                <button class="btn btn-primary btn-print no-print" id="btn-print"><span data-icon="print"></span></button>
            </div>
        </div>
    </main>

    <script type="module" src="../src/pages/certificate.js"></script>
  <script type="module" src="../src/js/cookieconsent.js"></script>
  <script type="module" src="../src/js/icons.js"></script>
</body>

</html>
